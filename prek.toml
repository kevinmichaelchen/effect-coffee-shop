#:schema https://www.schemastore.org/prek.json

# Every check runs here; there is no GitHub CI. The slower a check, the rarer
# the operation that runs it: commit (format, lint, typecheck, Fallow),
# push (affected unit tests and builds), release tag (integration tests).
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "detect-private-key" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
# One Turbo graph, so the tasks run in parallel and share its cache. Fallow
# runs here too: it costs well under a second warm, and its cached result is
# what makes the pre-push audit free.
id = "static"
name = "format, lint, typecheck and architecture"
entry = "bunx turbo run typecheck lint fmt:check //#fmt:check:root //#fallow"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
# D2 is banned (AGENTS.md): diagrams are Pele Mermaid sources.
id = "no-d2"
name = "no D2 diagrams"
entry = "D2 is banned in this repository: draw the diagram with Pele (Mermaid) instead, see AGENTS.md."
language = "fail"
files = '\.d2$'
stages = ["pre-commit"]

[[repos.hooks]]
# check:affected compares the pushed range (PRE_COMMIT_FROM_REF..TO_REF), not
# the local main, so pushing straight to main still runs the affected tests.
id = "check-affected"
name = "affected checks and full codebase audits"
entry = "bun run check:affected"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
# Pushing a v* tag (a release) runs the slow checks commits and ordinary
# pushes skip: the emulator and Rivet stack tests and Fallow's typed health
# pass. The script exits at once for every other ref.
id = "release-gate"
name = "release checks (v* tags only)"
entry = "packages/tooling/hooks/release-gate.sh"
language = "script"
always_run = true
pass_filenames = false
stages = ["pre-push"]
