receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  attributes/redact_gen_ai_payloads:
    actions:
      - key: gen_ai.prompt_json
        action: delete
      - key: gen_ai.completion_json
        action: delete
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  otlphttp/upstream:
    endpoint: ${env:UPSTREAM_OTLP_HTTP_ENDPOINT}
    headers:
      Authorization: ${env:UPSTREAM_OTLP_AUTHORIZATION}
  debug:
    verbosity: normal

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact_gen_ai_payloads, batch]
      exporters: [otlphttp/upstream]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact_gen_ai_payloads, batch]
      exporters: [otlphttp/upstream]
