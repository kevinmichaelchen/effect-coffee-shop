name = "effect-coffee-ordering-qwen-0.8b-product-readiness-warmup"
model = "Qwen/Qwen3.5-0.8B"
checkpoint_id = "oo8lrytspz37lfsdlloubig7"

# Warm-starts from the available Iteration 2 checkpoint. The final champion
# adapter rqvfrcdy4xt95oka37b0xjyu is deployable, but not accepted as a
# Hosted Training checkpoint_id by the current Prime CLI.
# max_steps is absolute from the source checkpoint's step 25, so 50 means 25
# additional warmup steps.
# Publish the checked-in environment as version 0.1.12 before launching this.
# This broadens training from receipt formatting into cashier product behavior.
max_steps = 50
batch_size = 64
rollouts_per_example = 4
oversampling_factor = 1.0
learning_rate = 3e-5
lora_alpha = 16
max_async_level = 1

[sampling]
max_tokens = 180
temperature = 0.4

[[env]]
id = "kevinmichaelchen/effect-coffee-ordering"
version = "0.1.12"
args = { split = "product_readiness" }

[val]
interval = 5
num_examples = 8
rollouts_per_example = 2

[eval]
interval = 5
num_examples = 8
rollouts_per_example = 2
eval_base_model = false

[[eval.env]]
id = "kevinmichaelchen/effect-coffee-ordering"
name = "effect-coffee-hard-eval"
version = "0.1.12"
args = { split = "hard_eval" }
num_examples = 8
rollouts_per_example = 2

[[eval.env]]
id = "kevinmichaelchen/effect-coffee-ordering"
name = "effect-coffee-product-readiness"
version = "0.1.12"
args = { split = "product_readiness" }
num_examples = 16
rollouts_per_example = 2

[adapters]
interval = 5
keep_last = 2

[checkpoints]
interval = 5
keep_cloud = 2
