name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [static, backend, ui]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      # Cache task outputs, not node_modules: install always applies the Effect
      # compiler patch to the exact TypeScript version in the lockfile.
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('bun.lock', 'turbo.json', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('bun.lock', 'turbo.json', '.node-version') }}-
      - name: Install dependencies and patch the Effect compiler
        run: bun install --frozen-lockfile
      - name: Run ${{ matrix.check }} checks
        run: bun run ci:${{ matrix.check }}
