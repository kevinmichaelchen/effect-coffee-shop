name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [static, backend, ui]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      # Cache task outputs, not node_modules: install always applies the Effect
      # compiler patch to the exact TypeScript version in the lockfile.
      - uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.check }}-${{ hashFiles('bun.lock', 'turbo.json') }}-
      - name: Install dependencies and patch the Effect compiler
        run: bun install --frozen-lockfile
      - name: Install Chromium
        if: matrix.check == 'ui'
        working-directory: apps/ui
        run: bunx --no-install playwright install --with-deps --only-shell chromium
      - name: Run ${{ matrix.check }} checks
        run: bun run ci:${{ matrix.check }}

  contract-postgres-service:
    name: repository contract (Postgres service container)
    runs-on: ubuntu-latest
    # Fidelity backstop against a real Postgres server (real @effect/sql-pg
    # driver + wire protocol). Slow (image pull + health-check wait) and needs
    # a service container, so keep it its own job and run only on main; PRs
    # run these contracts within the backend suite above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: coffee
          POSTGRES_DB: coffee
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run server-backed repository contract
        working-directory: packages/coffee/external/drizzle-postgres
        env:
          COFFEE_POSTGRES_TEST_URL: postgres://postgres:coffee@localhost:5432/coffee
        run: bunx vitest run src/repositories/contract.test.ts
