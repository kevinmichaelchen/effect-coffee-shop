[install]
linker = "isolated"
globalStore = true
minimumReleaseAge = 259200
# Bun 1.3.11 only honors package-level release-age exclusions.
# pglite-test and its constructive-io dependency chain publish faster than the
# release-age window; all are from the same publisher.
minimumReleaseAgeExcludes = [
  "alchemy",
  "effect",
  "@effect/platform-bun",
  "@effect/platform-node",
  "@effect/platform-node-shared",
  "@effect/sql-d1",
  "@effect/sql-pg",
  "@effect/sql-pglite",
  "@effect/sql-sqlite-bun",
  "@effect/vitest",
  "pglite-test",
  "@pgpmjs/core",
  "@pgpmjs/env",
  "@pgpmjs/pglite-adapter",
  "@pgpmjs/types",
  "pg-cache",
  "pg-env",
  "pgsql-client",
  "pgsql-test",
  "@pgpmjs/ast",
  "@pgpmjs/bundle",
  "csv-to-pg",
  "pgsql-deparser",
  "pgsql-parser",
  "pgsql-seed",
  "@pgpmjs/traverse",
  "@pgsql/quotes",
  "@pgsql/utils",
  "libpg-query",
]
