[install]
linker = "isolated"
globalStore = true
minimumReleaseAge = 259200
# Bun 1.3.11 only honors package-level release-age exclusions.
# pglite-test and its constructive-io dependency chain publish faster than the
# release-age window; all are from the same publisher.
minimumReleaseAgeExcludes = [
  # Explicitly adopted launch release; version pinned in the workspace catalog.
  "@shadcn/lint",
  "alchemy",
  # alchemy pins its @alchemy.run/* and @distilled.cloud/* siblings to the same
  # release, so they ship together with each adopted alchemy version.
  "@alchemy.run/cloudflare-runtime",
  "@alchemy.run/floci",
  "@alchemy.run/node-utils",
  "@distilled.cloud/acme",
  "@distilled.cloud/aws",
  "@distilled.cloud/axiom",
  "@distilled.cloud/cloudflare",
  "@distilled.cloud/core",
  "@distilled.cloud/doppler",
  "@distilled.cloud/fly-io",
  "@distilled.cloud/gcp",
  "@distilled.cloud/hetzner",
  "@distilled.cloud/infisical",
  "@distilled.cloud/neon",
  "@distilled.cloud/planetscale",
  "@distilled.cloud/prisma",
  "@distilled.cloud/railway",
  "@distilled.cloud/stripe",
  "@distilled.cloud/zerossl",
  "effect",
  "@effect/platform-bun",
  "@effect/platform-node",
  "@effect/platform-node-shared",
  "@effect/sql-d1",
  "@effect/sql-pg",
  "@effect/sql-pglite",
  "@effect/sql-sqlite-bun",
  "@effect/sql-sqlite-do",
  "@effect/vitest",
  # The Effect language service ships each platform binary as a separate
  # exact-version package, so every binding must be listed.
  "@effect/tsgo",
  "@effect/tsgo-darwin-arm64",
  "@effect/tsgo-darwin-x64",
  "@effect/tsgo-linux-arm",
  "@effect/tsgo-linux-arm64",
  "@effect/tsgo-linux-x64",
  "@effect/tsgo-win32-arm64",
  "@effect/tsgo-win32-x64",
  "pglite-test",
  "@pgpmjs/core",
  "@pgpmjs/env",
  "@pgpmjs/pglite-adapter",
  "@pgpmjs/types",
  "pg-cache",
  "pg-env",
  "pgsql-client",
  "pgsql-test",
  "@pgpmjs/ast",
  "@pgpmjs/bundle",
  "csv-to-pg",
  "pgsql-deparser",
  "pgsql-parser",
  "pgsql-seed",
  "@pgpmjs/traverse",
  "@pgsql/quotes",
  "@pgsql/utils",
  "libpg-query",
  # prek, oxlint and oxfmt are adopted as soon as they publish (decision 2026-09-15).
  # Each ships platform binaries as separate exact-version packages, so every
  # binding must be listed; oxlint-tsgolint is oxlint's type-aware companion.
  "@j178/prek",
  "@j178/prek-android-arm64",
  "@j178/prek-darwin-arm64",
  "@j178/prek-darwin-x64",
  "@j178/prek-linux-arm64-gnu",
  "@j178/prek-linux-arm64-musl",
  "@j178/prek-linux-x64-gnu",
  "@j178/prek-linux-x64-musl",
  "@j178/prek-win32-arm64-msvc",
  "@j178/prek-win32-x64-msvc",
  "oxlint",
  "@oxlint/plugins",
  "@oxlint/binding-android-arm-eabi",
  "@oxlint/binding-android-arm64",
  "@oxlint/binding-darwin-arm64",
  "@oxlint/binding-darwin-x64",
  "@oxlint/binding-freebsd-x64",
  "@oxlint/binding-linux-arm-gnueabihf",
  "@oxlint/binding-linux-arm-musleabihf",
  "@oxlint/binding-linux-arm64-gnu",
  "@oxlint/binding-linux-arm64-musl",
  "@oxlint/binding-linux-ppc64-gnu",
  "@oxlint/binding-linux-riscv64-gnu",
  "@oxlint/binding-linux-riscv64-musl",
  "@oxlint/binding-linux-s390x-gnu",
  "@oxlint/binding-linux-x64-gnu",
  "@oxlint/binding-linux-x64-musl",
  "@oxlint/binding-openharmony-arm64",
  "@oxlint/binding-win32-arm64-msvc",
  "@oxlint/binding-win32-ia32-msvc",
  "@oxlint/binding-win32-x64-msvc",
  "oxfmt",
  "@oxfmt/binding-android-arm-eabi",
  "@oxfmt/binding-android-arm64",
  "@oxfmt/binding-darwin-arm64",
  "@oxfmt/binding-darwin-x64",
  "@oxfmt/binding-freebsd-x64",
  "@oxfmt/binding-linux-arm-gnueabihf",
  "@oxfmt/binding-linux-arm-musleabihf",
  "@oxfmt/binding-linux-arm64-gnu",
  "@oxfmt/binding-linux-arm64-musl",
  "@oxfmt/binding-linux-ppc64-gnu",
  "@oxfmt/binding-linux-riscv64-gnu",
  "@oxfmt/binding-linux-riscv64-musl",
  "@oxfmt/binding-linux-s390x-gnu",
  "@oxfmt/binding-linux-x64-gnu",
  "@oxfmt/binding-linux-x64-musl",
  "@oxfmt/binding-openharmony-arm64",
  "@oxfmt/binding-win32-arm64-msvc",
  "@oxfmt/binding-win32-ia32-msvc",
  "@oxfmt/binding-win32-x64-msvc",
  "oxlint-tsgolint",
  "@oxlint-tsgolint/darwin-arm64",
  "@oxlint-tsgolint/darwin-x64",
  "@oxlint-tsgolint/linux-arm64",
  "@oxlint-tsgolint/linux-x64",
  "@oxlint-tsgolint/win32-arm64",
  "@oxlint-tsgolint/win32-x64",
]
